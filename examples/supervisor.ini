; Supervisor program. Copy to /etc/supervisor/conf.d/ (or /etc/supervisord.d/) and adjust the paths.
;   supervisorctl reread && supervisorctl update
; The number of connections is capped by supervisord's own open-file limit (minfds in supervisord.conf).
[program:websockets-server]
command=/opt/websockets-server/websockets-server -addr 127.0.0.1:6001 -env /var/www/app/.env -origins "https://app.example.com"
directory=/opt/websockets-server
user=www-data
autostart=true
autorestart=true
startsecs=3
redirect_stderr=true
stdout_logfile=/var/log/websockets-server.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
